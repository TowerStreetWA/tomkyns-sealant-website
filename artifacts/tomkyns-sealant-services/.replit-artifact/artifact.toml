kind = "web"
previewPath = "/"
title = "Tomkyns Sealant Services"
description = "A fast, trustworthy website for Tomkyns Sealant Services in Upminster, helping domestic and commercial customers understand the service, request a free quote, and giving the owner a secure place to manage enquiries and jobs."
version = "1.0.0"
id = "artifacts/tomkyns-sealant-services"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21250

[services.development]
run = "pnpm --filter @workspace/tomkyns-sealant-services run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tomkyns-sealant-services", "run", "build" ]
serve = "static"
publicDir = "artifacts/tomkyns-sealant-services/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21250"
BASE_PATH = "/"
